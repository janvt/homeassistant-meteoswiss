name: Tests

on:
  push:
  pull_request:
  # For a new Home Assistant version when nothing is pushed. Its failures are
  # reported as issues.
  schedule:
    - cron: "0 5 * * *"
  # To try the reporting.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  test:
    name: Tests (Home Assistant ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    # A beta breaking something does not block a change, but shows what the
    # next release will.
    continue-on-error: ${{ matrix.homeassistant == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        # The test harness pins the Home Assistant version it matches, and
        # Home Assistant moves to new Python versions quickly.
        include:
          # The minimum in hacs.json, with the pycares of its time: its harness
          # takes the thread of newer ones for one a test left running.
          - homeassistant: "2024.12.0"
            pins: "pytest-homeassistant-custom-component==0.13.190 pycares==4.5.0"
            python: "3.12"
          - homeassistant: latest
            pins: ""
            python: "3.14"
          # The harness of the newest beta, or of the latest release when
          # there is no beta, with asyncio and Python warning about more.
          - homeassistant: beta
            pins: ""
            python: "3.14"
            debug: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: pip install -r requirements_test.txt ${{ matrix.pins }}
      - name: Install the beta
        if: matrix.homeassistant == 'beta'
        run: pip install --pre --upgrade pytest-homeassistant-custom-component
      - name: Show the Home Assistant version
        id: version
        run: |
          version=$(pip show homeassistant | sed -n 's/^Version: //p')
          echo "Home Assistant $version"
          echo "homeassistant=$version" >> "$GITHUB_OUTPUT"
      - name: Run tests
        env:
          PYTHONASYNCIODEBUG: ${{ matrix.debug && '1' || '' }}
          PYTHONDEVMODE: ${{ matrix.debug && '1' || '' }}
        run: pytest --cov=custom_components.meteoswiss --cov-report=term-missing
      # One issue for each job: opened when it fails, commented on while it
      # keeps failing, and closed when it passes again.
      - name: Report the result
        if: >-
          !cancelled()
          && contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Tests fail on Home Assistant ${{ matrix.homeassistant }}
          VERSION: ${{ steps.version.outputs.homeassistant || 'unknown' }}
          STATUS: ${{ job.status }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq 'map(select(.title == env.TITLE))[0].number // empty')
          if [ "$STATUS" = success ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "They pass again on $VERSION: $RUN"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "They still fail on $VERSION: $RUN"
          else
            gh issue create --title "$TITLE" --body "The daily tests fail on Home Assistant $VERSION: $RUN

          This issue is closed when they pass again."
          fi
