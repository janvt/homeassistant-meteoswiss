version: 2
updates:
  # The actions of the workflows, in one pull request a week.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # The pinned requirements of the tests. A pyfive update also has to change
  # the pin in manifest.json, which Dependabot does not read; a test fails
  # until it does.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
