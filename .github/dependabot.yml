version: 2
updates:
  # The actions of the workflows, in one pull request a week.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # The pinned requirements of the tests. A pyfive update also has to change
  # the pin in manifest.json, which Dependabot does not read; a test fails
  # until it does.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # From 1.3.0 pyfive needs numcodecs, which has no musllinux wheels on
      # PyPI or on Home Assistant's wheel index, so it would have to be built
      # on Home Assistant OS and the container, which are Alpine.
      - dependency-name: pyfive
        versions: [">=1.3.0"]
