# Home Assistant core's strict settings (its mypy.ini, without its own
# plugins and stubs), for the quality scale's strict-typing rule.
[mypy]
# custom_components has no __init__.py.
explicit_package_bases = true
files = custom_components/meteoswiss
python_version = 3.14
platform = linux
show_error_codes = true
follow_imports = normal
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = deprecated, explicit-override, ignore-without-code, redundant-self, truthy-iterable
disable_error_code = annotation-unchecked, import-not-found, import-untyped
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true

[mypy-homeassistant.*]
no_implicit_reexport = true

# Home Assistant installs probatio as voluptuous at run time, and types its
# schemas as probatio's: voluptuous's own types would not match them.
[mypy-voluptuous.*]
follow_imports = skip
